naftiko: 1.0.0-alpha2
info:
  label: Vagrant Box Lifecycle
  description: Unified workflow capability for managing the complete Vagrant box lifecycle - from searching the public catalog
    and creating new boxes, to publishing versions and managing providers. Designed for DevOps engineers and platform teams
    automating development environment distribution via Vagrant Cloud.
  tags:
  - DevOps
  - Virtualization
  - Vagrant
  - Boxes
  - HashiCorp
  - CI/CD
  - Infrastructure
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    VAGRANT_CLOUD_TOKEN: VAGRANT_CLOUD_TOKEN
capability:
  consumes:
  - type: http
    namespace: vagrant-cloud
    baseUri: https://app.vagrantup.com/api/v2
    description: Vagrant Cloud API for box lifecycle management
    authentication:
      type: bearer
      token: '{{VAGRANT_CLOUD_TOKEN}}'
    resources:
    - name: search
      path: /search
      description: Search the public Vagrant box catalog
      operations:
      - name: search-boxes
        method: GET
        description: Search for Vagrant boxes in the public catalog
        inputParameters:
        - name: q
          in: query
          type: string
          required: false
          description: Search query
        - name: provider
          in: query
          type: string
          required: false
          description: Filter by provider
        - name: architecture
          in: query
          type: string
          required: false
          description: Filter by architecture
        - name: sort
          in: query
          type: string
          required: false
          description: Sort by downloads, updated, or created
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results to return
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: boxes
      path: /boxes
      description: Manage Vagrant boxes
      operations:
      - name: create-box
        method: POST
        description: Create a new Vagrant box
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            username: '{{tools.username}}'
            name: '{{tools.name}}'
            short_description: '{{tools.short_description}}'
            is_private: '{{tools.is_private}}'
    - name: box
      path: /box/{username}/{name}
      description: Individual box management
      operations:
      - name: get-box
        method: GET
        description: Retrieve a specific Vagrant box
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
          description: Box owner username
        - name: name
          in: path
          type: string
          required: true
          description: Box name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-box
        method: PUT
        description: Update a Vagrant box
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
          description: Box owner username
        - name: name
          in: path
          type: string
          required: true
          description: Box name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-box
        method: DELETE
        description: Delete a Vagrant box
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
          description: Box owner username
        - name: name
          in: path
          type: string
          required: true
          description: Box name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: versions
      path: /box/{username}/{name}/versions
      description: Box versions management
      operations:
      - name: create-version
        method: POST
        description: Create a new version for a box
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
          description: Box owner username
        - name: name
          in: path
          type: string
          required: true
          description: Box name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: version
      path: /box/{username}/{name}/version/{version}
      description: Individual version management
      operations:
      - name: get-version
        method: GET
        description: Retrieve a specific box version
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
        - name: name
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: release-version
        method: PUT
        description: Release a version making it available for download
        inputParameters:
        - name: username
          in: path
          type: string
          required: true
        - name: name
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: box-lifecycle-api
    description: Unified REST API for Vagrant box lifecycle management.
    resources:
    - path: /v1/boxes
      name: boxes
      description: Search and create Vagrant boxes
      operations:
      - method: GET
        name: search-boxes
        description: Search the Vagrant box catalog
        call: vagrant-cloud.search-boxes
        with:
          q: rest.q
          provider: rest.provider
          sort: rest.sort
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-box
        description: Create a new Vagrant box
        call: vagrant-cloud.create-box
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/boxes/{username}/{name}
      name: box
      description: Individual box management
      operations:
      - method: GET
        name: get-box
        description: Get a specific Vagrant box
        call: vagrant-cloud.get-box
        with:
          username: rest.username
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-box
        description: Update a Vagrant box
        call: vagrant-cloud.update-box
        with:
          username: rest.username
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-box
        description: Delete a Vagrant box
        call: vagrant-cloud.delete-box
        with:
          username: rest.username
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/boxes/{username}/{name}/versions
      name: versions
      description: Box version management
      operations:
      - method: POST
        name: create-version
        description: Create a new version for a box
        call: vagrant-cloud.create-version
        with:
          username: rest.username
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/boxes/{username}/{name}/versions/{version}
      name: version
      description: Individual version management
      operations:
      - method: GET
        name: get-version
        description: Get a specific box version
        call: vagrant-cloud.get-version
        with:
          username: rest.username
          name: rest.name
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/boxes/{username}/{name}/versions/{version}/release
      name: version-release
      description: Release a box version
      operations:
      - method: PUT
        name: release-version
        description: Publish a box version
        call: vagrant-cloud.release-version
        with:
          username: rest.username
          name: rest.name
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: box-lifecycle-mcp
    transport: http
    description: MCP server for AI-assisted Vagrant box lifecycle management.
    tools:
    - name: search-boxes
      description: Search the public Vagrant box catalog
      hints:
        readOnly: true
        openWorld: true
      call: vagrant-cloud.search-boxes
      with:
        q: tools.q
        provider: tools.provider
        sort: tools.sort
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-box
      description: Get details for a specific Vagrant box
      hints:
        readOnly: true
        idempotent: true
      call: vagrant-cloud.get-box
      with:
        username: tools.username
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: create-box
      description: Create a new Vagrant box in the registry
      hints:
        readOnly: false
      call: vagrant-cloud.create-box
      outputParameters:
      - type: object
        mapping: $.
    - name: update-box
      description: Update a Vagrant box metadata
      hints:
        readOnly: false
        idempotent: true
      call: vagrant-cloud.update-box
      with:
        username: tools.username
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-box
      description: Delete a Vagrant box
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: vagrant-cloud.delete-box
      with:
        username: tools.username
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: create-version
      description: Create a new version for a Vagrant box
      hints:
        readOnly: false
      call: vagrant-cloud.create-version
      with:
        username: tools.username
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: get-version
      description: Get a specific box version details
      hints:
        readOnly: true
        idempotent: true
      call: vagrant-cloud.get-version
      with:
        username: tools.username
        name: tools.name
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
    - name: release-version
      description: Publish a box version to make it available for download
      hints:
        readOnly: false
        idempotent: true
      call: vagrant-cloud.release-version
      with:
        username: tools.username
        name: tools.name
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
