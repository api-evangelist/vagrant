naftiko: "1.0.0-alpha1"

info:
  label: Vagrant Cloud API
  description: >-
    Vagrant Cloud API v2 for managing Vagrant boxes, versions, providers,
    and searching the public box catalog.
  tags:
    - DevOps
    - Virtualization
    - Vagrant
    - Boxes
    - HashiCorp
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      VAGRANT_CLOUD_TOKEN: VAGRANT_CLOUD_TOKEN

capability:
  consumes:
    - type: http
      namespace: vagrant-cloud
      baseUri: https://app.vagrantup.com/api/v2
      description: Vagrant Cloud API for box lifecycle management
      authentication:
        type: bearer
        token: "{{VAGRANT_CLOUD_TOKEN}}"
      resources:
        - name: search
          path: /search
          description: Search the public Vagrant box catalog
          operations:
            - name: search-boxes
              method: GET
              description: Search for Vagrant boxes in the public catalog
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: Search query
                - name: provider
                  in: query
                  type: string
                  required: false
                  description: Filter by provider
                - name: architecture
                  in: query
                  type: string
                  required: false
                  description: Filter by architecture
                - name: sort
                  in: query
                  type: string
                  required: false
                  description: Sort by downloads, updated, or created
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Maximum results to return
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: boxes
          path: /boxes
          description: Manage Vagrant boxes
          operations:
            - name: create-box
              method: POST
              description: Create a new Vagrant box
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  name: "{{tools.name}}"
                  short_description: "{{tools.short_description}}"
                  is_private: "{{tools.is_private}}"
        - name: box
          path: /box/{username}/{name}
          description: Individual box management
          operations:
            - name: get-box
              method: GET
              description: Retrieve a specific Vagrant box
              inputParameters:
                - name: username
                  in: path
                  type: string
                  required: true
                  description: Box owner username
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Box name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-box
              method: PUT
              description: Update a Vagrant box
              inputParameters:
                - name: username
                  in: path
                  type: string
                  required: true
                  description: Box owner username
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Box name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-box
              method: DELETE
              description: Delete a Vagrant box
              inputParameters:
                - name: username
                  in: path
                  type: string
                  required: true
                  description: Box owner username
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Box name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: versions
          path: /box/{username}/{name}/versions
          description: Box versions management
          operations:
            - name: create-version
              method: POST
              description: Create a new version for a box
              inputParameters:
                - name: username
                  in: path
                  type: string
                  required: true
                  description: Box owner username
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Box name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: version
          path: /box/{username}/{name}/version/{version}
          description: Individual version management
          operations:
            - name: get-version
              method: GET
              description: Retrieve a specific box version
              inputParameters:
                - name: username
                  in: path
                  type: string
                  required: true
                - name: name
                  in: path
                  type: string
                  required: true
                - name: version
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: release-version
              method: PUT
              description: Release a version making it available for download
              inputParameters:
                - name: username
                  in: path
                  type: string
                  required: true
                - name: name
                  in: path
                  type: string
                  required: true
                - name: version
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: vagrant-cloud-rest
      resources:
        - path: /v1/boxes
          name: boxes
          operations:
            - method: GET
              name: search-boxes
              description: Search Vagrant boxes
              call: "vagrant-cloud.search-boxes"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: vagrant-cloud-mcp
      transport: http
      tools:
        - name: search-boxes
          description: Search the Vagrant box catalog
          hints:
            readOnly: true
            openWorld: true
          call: "vagrant-cloud.search-boxes"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-box
          description: Get details for a Vagrant box
          hints:
            readOnly: true
            idempotent: true
          call: "vagrant-cloud.get-box"
          outputParameters:
            - type: object
              mapping: "$."
